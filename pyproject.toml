[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barnette-search"
version = "0.9.2"
description = "Reference tools for computational research on Barnette graphs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Thomas Bauer"}]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
]

[project.optional-dependencies]
sat = [
    "python-sat>=1.8.dev1,<2",
]
plot = [
    "matplotlib>=3.8",
]
test = [
    "pytest>=8",
    "python-sat>=1.8.dev1,<2",
    "matplotlib>=3.8",
    "psutil>=5.9",
]

[project.urls]
Repository = "https://github.com/derdualeraum-Regensburg/barnette-search"
Issues = "https://github.com/derdualeraum-Regensburg/barnette-search/issues"

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
    "plantri_integration: requires an explicitly configured plantri 5.8 executable",
    "cubhamg_integration: requires an explicitly configured documented cubhamg executable",
]

[tool.setuptools.packages.find]
where = ["src"]
